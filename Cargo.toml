[workspace]
members = ["crates/droidops-core", "crates/droidops-device-services"]
default-members = ["crates/droidops-core", "crates/droidops-device-services"]
exclude = ["src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "time", "sync", "macros"] }

[profile.release]
lto = "thin"
strip = true
